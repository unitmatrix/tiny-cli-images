name: CI

on:
  pull_request:
    paths:
      - "images/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changes.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find changed images
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const supported = new Set(
              fs.readdirSync("images", { withFileTypes: true })
                .filter(
                  (entry) =>
                    entry.isDirectory() &&
                    fs.existsSync(`images/${entry.name}/image.toml`),
                )
                .map((entry) => entry.name),
            );
            const affected = new Set();
            const unknown = new Set();
            let shared = false;

            if (supported.size === 0) {
              core.setFailed("No supported images found");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            const expectedFiles = context.payload.pull_request.changed_files;
            if (files.length !== expectedFiles) {
              core.setFailed(
                `Expected ${expectedFiles} changed files, but GitHub returned ${files.length}`,
              );
              return;
            }

            for (const file of files) {
              const paths = [file.filename, file.previous_filename]
                .filter(Boolean);

              for (const path of paths) {
                if (
                  path.startsWith("scripts/") ||
                  path.startsWith(".github/workflows/")
                ) {
                  shared = true;
                }

                const match = path.match(/^images\/([^/]+)\//);
                if (!match) {
                  continue;
                }

                if (supported.has(match[1])) {
                  affected.add(match[1]);
                } else {
                  unknown.add(match[1]);
                }
              }
            }

            if (unknown.size > 0) {
              core.setFailed(
                `Unsupported image paths changed: ${[...unknown].sort().join(", ")}`,
              );
              return;
            }

            if (shared) {
              for (const image of supported) {
                affected.add(image);
              }
            }

            const images = [...affected].sort();
            if (images.length === 0) {
              core.setFailed("No affected images found");
              return;
            }

            core.info(`Affected images: ${images.join(", ")}`);
            core.setOutput("images", JSON.stringify(images));

  image:
    name: ${{ matrix.image }} / ${{ matrix.arch }}
    needs: changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read metadata
        id: meta
        run: python3 scripts/meta.py "${{ matrix.image }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: tiny/${{ matrix.image }}:test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SHA256_AMD64=${{ steps.meta.outputs.sha_amd64 }}
            SHA256_ARM64=${{ steps.meta.outputs.sha_arm64 }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Test
        run: images/${{ matrix.image }}/test.sh tiny/${{ matrix.image }}:test

  result:
    name: CI result
    if: always()
    needs:
      - changes
      - image
    runs-on: ubuntu-latest

    steps:
      - name: Verify jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$IMAGE_RESULT" = success
