name: Release

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          tool="${tag%%/*}"
          version="${tag#*/v}"

          echo "tool=${tool}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read metadata
        id: meta
        run: |
          python3 scripts/meta.py "${{ steps.tag.outputs.tool }}"

      - name: Verify release version
        shell: bash
        run: |
          test \
            "${{ steps.tag.outputs.version }}" = \
            "${{ steps.meta.outputs.version }}"

      - name: Set image
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo \
            "name=ghcr.io/${owner}/${{ steps.meta.outputs.name }}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.name }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/tree/${{ github.sha }}/images/${{ steps.tag.outputs.tool }}
            org.opencontainers.image.licenses=${{ steps.meta.outputs.license }}
          annotations: |
            org.opencontainers.image.title=${{ steps.meta.outputs.name }}
            org.opencontainers.image.description=${{ steps.meta.outputs.description }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/tree/${{ github.sha }}/images/${{ steps.tag.outputs.tool }}
            org.opencontainers.image.licenses=${{ steps.meta.outputs.license }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ steps.tag.outputs.tool }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SHA256_AMD64=${{ steps.meta.outputs.sha_amd64 }}
            SHA256_ARM64=${{ steps.meta.outputs.sha_arm64 }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.name }}
          provenance: mode=max
          sbom: true

      - name: Attest image
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Publish immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: actions/github-script@v9
        env:
          TOOL: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const tool = process.env.TOOL;
            const version = process.env.VERSION;
            const upstream = process.env.UPSTREAM;
            const image = process.env.IMAGE;
            const digest = process.env.DIGEST;
            const attestationUrl = process.env.ATTESTATION_URL;
            const imageTag = `${image}:${version}`;
            const imageDigest = `${image}@${digest}`;
            const workflowUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const upstreamUrl =
              `https://github.com/${upstream}/releases/tag/v${version}`;
            const startMarker = "<!-- tiny-cli-images:container:start -->";
            const endMarker = "<!-- tiny-cli-images:container:end -->";
            const links = [
              `[Upstream](${upstreamUrl})`,
              `[Build](${workflowUrl})`,
            ];
            if (attestationUrl) {
              links.push(`[Attestation](${attestationUrl})`);
            }

            const details = [
              startMarker,
              `Minimal ${tool} v${version} image for \`linux/amd64\` and \`linux/arm64\`.`,
              "",
              `**Image:** \`${imageTag}\``,
              `**Digest:** \`${digest}\``,
              "",
              "```sh",
              `docker run --rm ${imageDigest} --version`,
              "```",
              "",
              links.join(" · "),
              endMarker,
            ].join("\n");

            let release = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (!release) {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `${tool} v${version}`,
                body: details,
                draft: false,
                prerelease: false,
                make_latest: "true",
              });
              return;
            }

            const currentBody = release.body || "";
            const start = currentBody.indexOf(startMarker);
            const end = currentBody.indexOf(endMarker);
            let body;

            if (start !== -1 && end > start) {
              body =
                currentBody.slice(0, start) +
                details +
                currentBody.slice(end + endMarker.length);
            } else {
              body = [currentBody.trim(), details].filter(Boolean).join("\n\n");
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: release.name || `${tool} v${version}`,
              body,
              draft: false,
              prerelease: release.prerelease,
            });
