name: Release

on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          tool="${tag%%/*}"
          version="${tag#*/v}"

          echo "tool=${tool}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read metadata
        id: meta
        run: |
          python3 scripts/meta.py "${{ steps.tag.outputs.tool }}"

      - name: Verify release version
        shell: bash
        run: |
          test \
            "${{ steps.tag.outputs.version }}" = \
            "${{ steps.meta.outputs.version }}"

      - name: Set image
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo \
            "name=ghcr.io/${owner}/${{ steps.meta.outputs.name }}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ steps.meta.outputs.upstream }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/${{ steps.tag.outputs.tool }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SHA256_AMD64=${{ steps.meta.outputs.sha_amd64 }}
            SHA256_ARM64=${{ steps.meta.outputs.sha_arm64 }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.name }}
          provenance: mode=max
          sbom: true

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Publish immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
